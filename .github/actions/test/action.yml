name: Test
description: Verify package controls, test-runner controls, addon behavior and shipping output.
runs:
  using: composite
  steps:
    - name: "Set up Godot"
      uses: ./.github/actions/setup-godot
      with:
        install-templates: 'true'
    - name: Run the same full gate as local development
      shell: bash
      run: make check
