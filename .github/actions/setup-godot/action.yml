name: Setup Godot
description: Install the checksummed Godot 4.7.2 binary and optional templates
inputs:
  install-templates:
    description: 'Whether to install export templates'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Cache reviewed Godot archives
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/gd-audio-godot-downloads
        key: gd-audio-godot-${{ hashFiles('tools/godot-release.json', 'tools/setup_godot.sh') }}
    - name: Install and verify Godot
      shell: bash
      env:
        GODOT_ARCHIVE_DIR: ${{ runner.temp }}/gd-audio-godot-downloads
        GODOT_BINARY_DIR: ${{ runner.temp }}/gd-audio-godot-bin
        INSTALL_TEMPLATES: ${{ inputs.install-templates }}
      run: |
        set -euo pipefail
        ./tools/setup_godot.sh
