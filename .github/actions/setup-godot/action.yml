name: Setup Godot
description: Install caller-reviewed Godot through the immutable shared installer
inputs:
  install-templates:
    description: Whether to install export templates
    default: 'false'
runs:
  using: composite
  steps:
    - uses: nicodes/tools/godot-setup@870195fe5f94d9b78a03d74ba5b54347cc670798 # reviewed immutable setup
      with:
        version: "4.7.2"
        binary-checksum: sha512:9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
        templates-checksum: sha512:ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079
        install-templates: ${{ inputs.install-templates }}
